<div class="card" style="margin:16px 0"><h3>Évolution des vues</h3>${chart(S2,'views')}</div>
<div class="card"><div class="f"><label>Date<input type="date" id="sd2" value="${new Date().toISOString().slice(0,10)}"></label><label>Vues<input type="number" min="0" id="sv"></label><label>Likes<input type="number" min="0" id="sl"></label><label>Commentaires<input type="number" min="0" id="sc"></label><label>Abonnés<input type="number" min="0" id="sf"></label></div><div class="err">${st.err}</div><button class="btn pri" data-a="savestat">Ajouter le relevé</button></div>`}
function favsP(){return `<h1>Favoris</h1>${favs().map((f,i)=>`<div class="card row" style="margin-bottom:8px"><span>${esc(f)}</span><span><button class="btn sm" data-a="copy" data-v="${esc(f)}">Copier</button> <button class="btn sm" data-a="delfav" data-i="${i}">Retirer</button></span></div>`).join('')||'<p style="color:var(--mu)">Aucun favori. Enregistre un contenu depuis le générateur ou les idées.</p>'}`}
function settings(){const pr=S.get('profile',{name:'',email:''});return `<h1>Paramètres</h1><div class="card"><h3>Profil</h3><div class="f"><label>Nom<input id="pn" value="${esc(pr.name)}"></label><label>E-mail<input id="pe" type="email" value="${esc(pr.email)}"></label></div><button class="btn pri" data-a="saveprof">Enregistrer</button> <button class="btn" data-a="wipe">Effacer mes données</button></div>
<div class="card" style="margin-top:14px"><h3>Compte</h3><p>Connecté en tant que ${esc(USER.email)}.</p></div>`}
function subscription(){return `<h1>Abonnement</h1><div class="card" style="margin-bottom:14px">Offre actuelle : <b>${ADMIN?'ADMIN (illimité)':PLAN.toUpperCase()}</b></div><div class="grid">${plan('PRO','5,99 €',['40 générations par semaine','Toutes les idées','Calendrier complet','Favoris'],1).replace(/<a class.*?<\/a>/,'<button class="btn pri" data-a="stripe" data-u="https://buy.stripe.com/aFa28r41cgmGb3ObYD6Vq07">Passer à PRO</button>')}${plan('PREMIUM','9,99 €',['Tout le plan Pro','200 générations par semaine','Outils avancés','Statistiques complètes']).replace(/<a class.*?<\/a>/,'<button class="btn" data-a="stripe" data-u="https://buy.stripe.com/fZudR90P06M6fk46Ej6Vq08">Passer à PREMIUM</button>')}</div>`}
const IA=[['Découpe automatique','Repère les meilleurs moments d’un long stream'],['Sous-titres automatiques','Transcrit la voix et affiche le texte'],['Format vertical 9:16','Recadre le clip pour TikTok, Shorts et Reels'],['Montage assisté','Rythme, zooms et effets']];
function montage(){return `<h1>Montage vidéo</h1><div class="card"><h3>Découpe manuelle (fonctionne dans ton navigateur)</h3><label>Ta vidéo<input type="file" id="vf" accept="video/*" data-a="vf"></label><video id="vp" controls playsinline style="width:100%;max-height:320px;margin-top:10px;display:none;border-radius:10px"></video><div id="vc" style="display:none"><div class="f"><label>Début : <span id="ts">0</span> s<input type="range" id="rs" min="0" max="0" step="0.1" value="0"></label><label>Fin : <span id="te">0</span> s<input type="range" id="re" min="0" max="0" step="0.1" value="0"></label></div><button class="btn sm" data-a="prev">Aperçu</button> <button class="btn pri sm" data-a="cut">Découper avec Novera</button> <button class="btn sm" data-a="find">Trouver les moments forts</button></div><div id="vr"></div><div id="vq"></div><div class="err" id="vm"></div><video id="vo" controls playsinline style="width:100%;margin-top:10px;display:none;border-radius:10px"></video><p style="color:var(--mu);font-size:13px">La découpe est enregistrée en temps réel : elle dure autant que l’extrait, et la vidéo ne doit pas être mise en pause. Pour garder le résultat, fais un clic droit ou un appui long sur la vidéo obtenue.</p></div><h3 style="margin-top:22px">Assistants IA</h3><div class="grid">${IA.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p><p class="err" style="margin-top:8px">Non connecté</p></div>`).join('')}</div><div class="demo" style="margin-top:14px">Ces modules demandent une API d’IA et un serveur (par exemple des fonctions Supabase) : le traitement vidéo ne peut pas tourner dans cette page, et les clés ne doivent jamais être dans le navigateur. Aucun résultat IA n’est simulé.</div>`}
let vEnd=0;
function vErr(m){$('#vm').textContent=m}
function prevVid(){const v=$('#vp'),s=+$('#rs').value;vEnd=+$('#re').value;v.currentTime=s;v.play()}
async function cutVid(){const v=$('#vp'),s=+$('#rs').value,e=+$('#re').value;vErr('');if(e-s<0.5)return vErr('Choisis un extrait d’au moins 0,5 s.');if(!v.captureStream||!window.MediaRecorder)return vErr('Ton navigateur ne permet pas la découpe ici.');
try{v.pause();await new Promise(r=>{v.onseeked=r;v.currentTime=s});const rec=new MediaRecorder(v.captureStream()),ch=[];rec.ondataavailable=x=>x.data.size&&ch.push(x.data);rec.onstop=()=>{const o=$('#vo');o.src=URL.createObjectURL(new Blob(ch,{type:rec.mimeType||'video/webm'}));o.style.display='block';toast('Extrait prêt')};vEnd=e;rec.start();v.play();const t=setInterval(()=>{if(v.currentTime>=e||v.ended){clearInterval(t);v.pause();rec.stop()}},100);vErr('Découpe en cours…')}catch(x){vErr('La découpe a échoué : '+x.message)}}
let vres=[],vb=[],segs=[];
function load(t,p){let o=$('#ld');if(!o){o=document.createElement('div');o.id='ld';o.className='ld';o.setAttribute('role','status');o.innerHTML='<b id="lt"></b><div class="bar"><i id="lb"></i></div>';document.body.appendChild(o)}$('#lt').textContent=t;$('#lb').style.width=Math.round(p*100)+'%'}
function unload(){const o=$('#ld');if(o)o.remove()}
function showSegs(){$('#vr').innerHTML='<h3>Moments forts trouvés</h3>'+segs.map((g,i)=>`<div class="card row" style="margin-top:8px"><span>Moment ${i+1} : ${g[0]} s → ${g[1]} s</span><button class="btn pri sm" data-a="segcut" data-i="${i}">Découper avec Novera</button></div>`).join('')+'<p style="color:var(--mu);font-size:13px">Détection par énergie sonore : ce sont les passages les plus bruyants, ce n’est pas une IA.</p>'}
function showRes(){$('#vq').innerHTML=vres.map((u,i)=>`<div class="card" style="margin-top:10px"><div class="row"><b>Extrait ${i+1} · Novera</b><button class="btn pri sm" data-a="share" data-i="${i}">Partager</button></div><video src="${u}" controls playsinline style="width:100%;margin-top:8px;border-radius:10px"></video></div>`).join('')+'<p style="color:var(--mu);font-size:13px">Appui long ou clic droit sur la vidéo pour l’enregistrer, puis publie-la sur TikTok à la main. La publication directe arrive bientôt.</p>'}
async function findBest(){const f=$('#vf').files[0];vErr('');if(!f)return vErr('Charge d’abord une vidéo.');if(f.size>150e6)return vErr('Fichier trop lourd pour l’analyse (150 Mo max).');
try{load('Analyse du son…',.1);const ac=new (window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(await f.arrayBuffer());load('Recherche des moments forts…',.7);const d=buf.getChannelData(0),sr=buf.sampleRate,n=Math.floor(buf.duration),e=[];for(let i=0;i<n;i++){let s=0;const a=i*sr,b=Math.min(a+sr,d.length);for(let j=a;j<b;j+=50)s+=d[j]*d[j];e.push(s)}
const L=Math.min(15,n),sc=[];for(let i=0;i+L<=n;i++){let s=0;for(let j=i;j<i+L;j++)s+=e[j];sc.push([i,s])}sc.sort((x,y)=>y[1]-x[1]);segs=[];for(const [i] of sc){if(segs.every(g=>Math.abs(g[0]-i)>=L))segs.push([i,i+L]);if(segs.length==3)break}
unload();ac.close();showSegs()}catch(x){unload();vErr('Analyse impossible (pas de piste audio lisible ?) : '+x.message)}}
function cutVid(){cutSeg(+$('#rs').value,+$('#re').value)}
async function cutSeg(s,e){const v=$('#vp');vErr('');if(e-s<.5)return vErr('Choisis un extrait d’au moins 0,5 s.');if(!window.MediaRecorder||!v.captureStream)return vErr('Ton navigateur ne permet pas la découpe ici.');
try{v.pause();await new Promise(r=>{v.onseeked=r;v.currentTime=s});const c=document.createElement('canvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;const x=c.getContext('2d'),fs=Math.max(18,Math.round(c.height/22));
const tr=[...c.captureStream(30).getVideoTracks(),...v.captureStream().getAudioTracks()],rec=new MediaRecorder(new MediaStream(tr)),ch=[];rec.ondataavailable=q=>q.data.size&&ch.push(q.data);const done=new Promise(r=>rec.onstop=r);let run=true;
const draw=()=>{if(!run)return;x.drawImage(v,0,0,c.width,c.height);x.font='800 '+fs+'px Sora,sans-serif';x.shadowColor='#000a';x.shadowBlur=6;x.fillStyle='#fff';x.fillText('Novera',fs*.6,fs*1.5);load('Montage en cours, garde cet écran ouvert…',Math.min(1,(v.currentTime-s)/(e-s)));if(v.currentTime>=e||v.ended){run=false;v.pause();rec.stop();return}requestAnimationFrame(draw)};
vEnd=0;load('Montage en cours…',0);rec.start();v.play();draw();await done;unload();const bl=new Blob(ch,{type:rec.mimeType||'video/webm'});vb.push(bl);vres.push(URL.createObjectURL(bl));showRes();toast('Extrait prêt')}catch(q){unload();vErr('La découpe a échoué : '+q.message)}}
const PAGES={overview,generator,ideas,calendar,montage,stats:statsP,favs:favsP,settings,subscription};
const ini=()=>esc((USER.email||'??').slice(0,2).toUpperCase());
function authView(){const su=mode=='signup',fg=mode=='forgot',rs=mode=='reset';return `<div class="wrap" style="max-width:400px;padding-top:70px"><a href="#/" class="logo" style="display:block;text-align:center;margin-bottom:20px;font-size:26px">No<b>vera</b></a><div class="card"><h3>${su?'Créer ton compte':fg?'Mot de passe oublié':rs?'Nouveau mot de passe':'Connexion'}</h3>${rs?'':'<label>Adresse e-mail<input id="ae" type="email" autocomplete="email"></label>'}${fg?'':`<label style="margin-top:10px">${rs?'Nouveau mot de passe':'Mot de passe'}<input id="ap" type="password" minlength="8" autocomplete="${su||rs?'new':'current'}-password"></label>`}<div class="err" id="am" style="margin-top:8px"></div><p><button class="btn pri" data-a="auth" style="width:100%">${su?'Créer mon compte':fg?'Envoyer le lien':rs?'Enregistrer':'Se connecter'}</button></p><p style="font-size:13px;color:var(--mu)">${su?'<a href="#/login" style="color:var(--b)">J’ai déjà un compte</a>':'<a href="#/signup" style="color:var(--b)">Créer un compte</a> · <a href="#/forgot" style="color:var(--b)">Mot de passe oublié</a>'}</p></div></div>`}
function aerr(m){const x=$('#am');if(x)x.textContent=m}
async function doAuth(){const e=$('#ae')?$('#ae').value.trim():'',p=$('#ap')?$('#ap').value:'';aerr('');
if(mode=='reset'){if(p.length<8)return aerr('8 caractères minimum.');const r=await sb.auth.updateUser({password:p});if(r.error)return aerr(r.error.message);location.hash='#/app/overview';return}
if(!e)return aerr('Indique ton adresse e-mail.');
if(mode=='forgot'){const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});return aerr(r.error?r.error.message:'Si ce compte existe, un e-mail vient d’être envoyé.')}
if(p.length<8)return aerr('Mot de passe : 8 caractères minimum.');
const r=mode=='signup'?await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:e,password:p});
if(r.error)return aerr(r.error.message);
if(mode=='signup'&&!r.data.session)aerr('Compte créé. Clique sur le lien reçu par e-mail pour le confirmer, puis connecte-toi.')}
async function quota(){const r=await sb.rpc('generation_status');if(!r.error&&r.data)QUOTA=r.data.admin?'Admin : générations illimitées.':`Il te reste ${r.data.remaining} sur ${r.data.limit} générations cette semaine (offre ${PLAN.toUpperCase()}).`}
async function boot(session){USER=session?session.user:null;if(USER){ADMIN=(USER.email||'').toLowerCase()==ADMIN_EMAIL;const d=await sb.from('user_data').select('key,value');(d.data||[]).forEach(r=>mem[r.key]=r.value);const p=await sb.from('profiles').select('plan').maybeSingle();PLAN=(p.data&&p.data.plan)||'free';await quota()}else{Object.keys(mem).forEach(k=>delete mem[k]);ADMIN=false}}
function render(){const h=location.hash||'#/',m=h.match(/^#\/app\/(\w+)/);
if(!sb){$('#root').innerHTML='<div class="wrap" style="padding-top:80px"><div class="card"><h3>Configuration requise</h3><p>Colle ta clé « anon public » Supabase dans la constante SB_KEY, en haut du script de index.html.</p></div></div>';return}
if(m){if(!USER){location.hash='#/login';return}const p=PAGES[m[1]]?m[1]:'overview';$('#root').innerHTML=shell(p,PAGES[p]());return}
const a=h.match(/^#\/(login|signup|forgot|reset)/);if(a){if(USER&&a[1]!='reset'){location.hash='#/app/overview';return}mode=a[1];$('#root').innerHTML=authView();return}
$('#root').innerHTML=landing()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
if(a=='menu')$('#sd').classList.toggle('open');
else if(a=='gen'){el.disabled=true;el.textContent='Génération…';doGen().finally(()=>{el.disabled=false})}
else if(a=='copy'){(navigator.clipboard?navigator.clipboard.writeText(d.v):Promise.reject()).then(()=>toast('Copié'),()=>toast('Copie impossible : sélectionne le texte à la main'))}
else if(a=='favgen'){S.set('favs',[st.gen.hook+' — '+st.gen.title,...favs()]);toast('Ajouté aux favoris')}
else if(a=='favidea'){const g=st.ideas||GAMES[0],x=IDEAS(g)[d.i];S.set('favs',[g+' : '+x[0]+' — '+x[1],...favs()]);toast('Ajouté aux favoris')}
else if(a=='delfav'){const f=favs();f.splice(+d.i,1);S.set('favs',f);render()}
else if(a=='mo'){st.mo+=+d.n;render()}
else if(a=='day'){st.edit={id:'',title:'',date:d.d,plat:'TikTok'};render()}
else if(a=='savepost'){const title=$('#pt').value.trim(),date=$('#pd').value;if(!title||!date){st.err='Indique un titre et une date.';return render()}st.err='';let P=posts();const o={id:d.id||String(Date.now()),title,date,plat:$('#pp').value};P=d.id?P.map(x=>x.id==d.id?o:x):[...P,o];S.set('posts',P);st.edit=null;toast(d.id?'Modifié':'Ajouté');render()}
else if(a=='editpost'){st.edit=posts().find(x=>x.id==d.id);render();scrollTo(0,document.body.scrollHeight)}
else if(a=='delpost'){S.set('posts',posts().filter(x=>x.id!=d.id));render()}
else if(a=='savestat'){const o={id:Date.now(),date:$('#sd2').value,views:$('#sv').value,likes:$('#sl').value,comments:$('#sc').value,followers:$('#sf').value};if(!o.date||o.views===''){st.err='Indique au moins la date et les vues.';return render()}st.err='';S.set('stats',[...stats(),o]);toast('Relevé ajouté');render()}
else if(a=='saveprof'){S.set('profile',{name:$('#pn').value,email:$('#pe').value});toast('Profil enregistré')}
else if(a=='wipe'){if(confirm('Effacer toutes les données de ce navigateur ?')){['gens','favs','posts','stats','profile'].forEach(k=>S.set(k,k=='profile'?{name:'',email:''}:[]));render()}}
else if(a=='stripe'){window.open(d.u+'?prefilled_email='+encodeURIComponent(USER.email)+'&client_reference_id='+USER.id,'_blank','noopener');toast('Paiement Stripe ouvert dans un nouvel onglet')}
else if(a=='cut')cutVid();else if(a=='prev')prevVid();else if(a=='find')findBest();else if(a=='segcut')cutSeg(segs[+d.i][0],segs[+d.i][1]);
else if(a=='tt'){const g=st.gen;window.open('https://www.tiktok.com/upload','_blank','noopener');if(navigator.clipboard)navigator.clipboard.writeText(g.hook+'\n\n'+g.desc+'\n'+g.tags).catch(()=>{});toast('Texte copié : colle-le dans TikTok')}
else if(a=='share'){const b=vb[+d.i],f=new File([b],'novera-'+(+d.i+1)+'.'+(b.type.includes('mp4')?'mp4':'webm'),{type:b.type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:'Novera'}).catch(()=>{});else{window.open('https://www.tiktok.com/upload','_blank','noopener');toast('Enregistre la vidéo (appui long), puis ajoute-la dans TikTok')}}
else if(a=='out'){sb.auth.signOut()}else if(a=='auth'){el.disabled=true;doAuth().finally(()=>{el.disabled=false})}});
document.addEventListener('change',e=>{if(e.target.dataset.a=='ig'){st.ideas=e.target.value;render()}
if(e.target.dataset.a=='vf'){const f=e.target.files[0];if(!f)return;const v=$('#vp');v.src=URL.createObjectURL(f);v.style.display='block';v.onloadedmetadata=()=>{const d=v.duration;if(!isFinite(d))return vErr('Durée illisible : essaie un fichier MP4.');['rs','re'].forEach(i=>$('#'+i).max=d);$('#rs').value=0;$('#re').value=d;$('#ts').textContent='0';$('#te').textContent=d.toFixed(1);$('#vc').style.display='block';vErr('')};v.onerror=()=>vErr('Vidéo illisible dans ce navigateur.');v.ontimeupdate=()=>{if(vEnd&&v.currentTime>=vEnd){v.pause();vEnd=0}}}});
document.addEventListener('input',e=>{if(e.target.id=='rs'||e.target.id=='re'){let s=+$('#rs').value,en=+$('#re').value;if(s>en){if(e.target.id=='rs')$('#rs').value=s=en;else $('#re').value=en=s}$('#ts').textContent=s.toFixed(1);$('#te').textContent=en.toFixed(1)}});
addEventListener('hashchange',()=>{if(location.hash&&!location.hash.startsWith('#/'))return;render();scrollTo(0,0);const r=$('#root');r.classList.remove('pg');void r.offsetWidth;r.classList.add('pg')});
if(sb){sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(async()=>{if(ev=='PASSWORD_RECOVERY'){USER=ses.user;location.hash='#/reset';return render()}await boot(ses);if(USER&&/^#\/(login|signup|forgot)/.test(location.hash))location.hash='#/app/overview';else render()},0)})}else render();
</script></body></html>
